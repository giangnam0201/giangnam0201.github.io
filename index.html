<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>giangnam0201 — Projects</title>
<style>
  :root {
    --bg: #0d1117;
    --bg-card: #161b22;
    --bg-card-hover: #1c2129;
    --border: #30363d;
    --border-hover: #6e7681;
    --text: #e6edf3;
    --text-dim: #8d96a0;
    --accent: #58a6ff;
    --accent-2: #d2a8ff;
    --gold: #f1c40f;
    --green: #3fb950;
    --orange: #ffa657;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
  }
  body {
    background:
      radial-gradient(ellipse at top left, rgba(88,166,255,0.08), transparent 50%),
      radial-gradient(ellipse at bottom right, rgba(210,168,255,0.06), transparent 50%),
      var(--bg);
  }
  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 60px 24px;
  }
  header {
    text-align: center;
    margin-bottom: 56px;
  }
  .avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    border: 2px solid var(--border);
    margin-bottom: 20px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: 700;
    color: #0d1117;
  }
  h1 {
    font-size: 42px;
    font-weight: 700;
    margin-bottom: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle {
    color: var(--text-dim);
    font-size: 17px;
    margin-bottom: 20px;
  }
  .profile-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 18px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--text);
    text-decoration: none;
    font-size: 14px;
    transition: all 0.18s;
  }
  .profile-link:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .stats {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-top: 28px;
    flex-wrap: wrap;
  }
  .stat {
    text-align: center;
  }
  .stat-num {
    font-size: 26px;
    font-weight: 700;
    color: var(--accent);
  }
  .stat-label {
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .filter-bar {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }
  .filter-btn {
    background: var(--bg-card);
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.15s;
    font-family: inherit;
  }
  .filter-btn:hover { color: var(--text); border-color: var(--border-hover); }
  .filter-btn.active {
    background: var(--accent);
    color: #0d1117;
    border-color: var(--accent);
    font-weight: 600;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 18px;
  }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    transition: all 0.18s;
    text-decoration: none;
    color: inherit;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.25s;
  }
  .card:hover {
    background: var(--bg-card-hover);
    border-color: var(--border-hover);
    transform: translateY(-2px);
  }
  .card:hover::before { transform: scaleX(1); }
  .card-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .card-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--accent);
    word-break: break-word;
  }
  .badge {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(110, 118, 129, 0.2);
    color: var(--text-dim);
    border: 1px solid var(--border);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    font-weight: 600;
  }
  .badge.fork { color: var(--orange); border-color: rgba(255,166,87,0.3); }
  .badge.original { color: var(--green); border-color: rgba(63,185,80,0.3); }
  .card-desc {
    color: var(--text-dim);
    font-size: 14px;
    margin: 6px 0 14px;
    flex-grow: 1;
    min-height: 20px;
  }
  .card-meta {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 12px;
    color: var(--text-dim);
    margin-top: auto;
    flex-wrap: wrap;
  }
  .meta-item {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .lang-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
  }
  .star { color: var(--gold); }
  .card-links {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .pill {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 6px;
    background: rgba(88,166,255,0.1);
    color: var(--accent);
    text-decoration: none;
    border: 1px solid rgba(88,166,255,0.2);
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .pill:hover {
    background: rgba(88,166,255,0.2);
    border-color: var(--accent);
  }
  .pill.demo {
    color: var(--accent-2);
    background: rgba(210,168,255,0.1);
    border-color: rgba(210,168,255,0.2);
  }
  .pill.demo:hover {
    background: rgba(210,168,255,0.2);
    border-color: var(--accent-2);
  }
  footer {
    text-align: center;
    margin-top: 60px;
    padding-top: 30px;
    border-top: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 13px;
  }
  footer a { color: var(--accent); text-decoration: none; }
  @media (max-width: 600px) {
    .container { padding: 40px 16px; }
    h1 { font-size: 32px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="avatar">G</div>
    <h1>giangnam0201</h1>
    <p class="subtitle">A collection of all my GitHub projects — apps, bots, simulators, and experiments.</p>
    <a class="profile-link" href="https://github.com/giangnam0201" target="_blank" rel="noopener">
      View on GitHub →
    </a>
    <div class="stats">
      <div class="stat"><div class="stat-num" id="total-count">0</div><div class="stat-label">Repositories</div></div>
      <div class="stat"><div class="stat-num" id="original-count">0</div><div class="stat-label">Original</div></div>
      <div class="stat"><div class="stat-num" id="star-count">0</div><div class="stat-label">Total Stars</div></div>
      <div class="stat"><div class="stat-num" id="demo-count">0</div><div class="stat-label">Live Demos</div></div>
    </div>
  </header>

  <div class="filter-bar">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="original">Original</button>
    <button class="filter-btn" data-filter="fork">Forks</button>
    <button class="filter-btn" data-filter="demo">Has Demo</button>
    <button class="filter-btn" data-filter="starred">Starred</button>
  </div>

  <div class="grid" id="project-grid"></div>

  <footer>
    Live data from the GitHub API · <a href="https://github.com/giangnam0201" target="_blank" rel="noopener">@giangnam0201</a>
  </footer>
</div>

<script>
const USERNAME = 'giangnam0201';
let projects = [];

const langColors = {
  "JavaScript":"#f1e05a","TypeScript":"#3178c6","Python":"#3572A5","HTML":"#e34c26",
  "Kotlin":"#A97BFF","Batchfile":"#C1F12E","Shell":"#89e051","Dockerfile":"#384d54",
  "C#":"#178600","Java":"#b07219"
};

const grid = document.getElementById('project-grid');
let activeFilter = 'all';

function render() {
  grid.innerHTML = '';
  const filtered = projects.filter(p => {
    if (activeFilter === 'all') return true;
    if (activeFilter === 'original') return !p.isFork;
    if (activeFilter === 'fork') return p.isFork;
    if (activeFilter === 'demo') return !!p.homepageUrl;
    if (activeFilter === 'starred') return p.stars > 0;
    return true;
  });

  filtered.forEach(p => {
    const card = document.createElement('a');
    card.className = 'card';
    card.href = p.url;
    card.target = '_blank';
    card.rel = 'noopener';

    const desc = p.description || '<em style="opacity:0.5">No description provided</em>';
    const langColor = langColors[p.language] || '#8d96a0';
    const langPart = p.language
      ? `<span class="meta-item"><span class="lang-dot" style="background:${langColor}"></span>${p.language}</span>`
      : '';
    const starPart = p.stars > 0
      ? `<span class="meta-item star">★ ${p.stars}</span>`
      : '';
    const demoPart = p.homepageUrl
      ? `<a class="pill demo" href="${p.homepageUrl}" target="_blank" rel="noopener" onclick="event.stopPropagation()">↗ Live demo</a>`
      : '';
    const badge = p.isFork
      ? '<span class="badge fork">Fork</span>'
      : '<span class="badge original">Original</span>';

    card.innerHTML = `
      <div class="card-head">
        <div class="card-title">${p.name}</div>
        ${badge}
      </div>
      <div class="card-desc">${desc}</div>
      <div class="card-meta">
        ${langPart}
        ${starPart}
        <span class="meta-item">⟳ ${p.updatedAt}</span>
      </div>
      <div class="card-links">
        <a class="pill" href="${p.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">⇱ Repository</a>
        ${demoPart}
      </div>
    `;
    grid.appendChild(card);
  });
}

function updateStats() {
  document.getElementById('total-count').textContent = projects.length;
  document.getElementById('original-count').textContent = projects.filter(p => !p.isFork).length;
  document.getElementById('star-count').textContent = projects.reduce((s, p) => s + p.stars, 0);
  document.getElementById('demo-count').textContent = projects.filter(p => p.homepageUrl).length;
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    render();
  });
});

function showMessage(html) {
  grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;color:var(--text-dim);padding:60px 20px;font-size:14px">${html}</div>`;
}

async function fetchProjects() {
  showMessage('Loading repositories from GitHub…');
  const all = [];
  let page = 1;
  while (page <= 5) {
    const res = await fetch(`https://api.github.com/users/${USERNAME}/repos?per_page=100&page=${page}`, {
      headers: { 'Accept': 'application/vnd.github+json' }
    });
    if (!res.ok) {
      throw new Error(`GitHub API ${res.status}` + (res.status === 403 ? ' — rate-limited, try again in a bit' : ''));
    }
    const data = await res.json();
    all.push(...data);
    if (data.length < 100) break;
    page++;
  }
  return all.map(r => ({
    name: r.name,
    description: r.description || '',
    url: r.html_url,
    homepageUrl: r.homepage || '',
    language: r.language,
    stars: r.stargazers_count || 0,
    updatedAt: (r.updated_at || '').slice(0, 10),
    isFork: !!r.fork,
  }));
}

(async () => {
  try {
    const repos = await fetchProjects();
    repos.sort((a, b) => b.stars - a.stars || b.updatedAt.localeCompare(a.updatedAt));
    projects = repos;
    updateStats();
    render();
    if (!projects.length) showMessage('No public repositories found.');
  } catch (err) {
    showMessage(`<span style="color:#ff7b72">Failed to load repositories: ${err.message}</span>`);
  }
})();
</script>
</body>
</html>
